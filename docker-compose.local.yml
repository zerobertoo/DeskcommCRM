# Stack local completa para desenvolvimento e VM Ubuntu.
#
# O Supabase local é gerenciado pelo `supabase start` e roda em Docker com os
# serviços oficiais de Postgres, Auth, PostgREST, Storage e Realtime. Este
# arquivo sobe os serviços da aplicação na mesma máquina, usando as portas
# publicadas pelo Supabase local.
#
# Uso: bash scripts/local-stack.sh up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: deskcomm-app:local
    pull_policy: never
    restart: unless-stopped
    env_file: ${LOCAL_ENV_FILE:-.env.local}
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      # O `worker` abaixo drena o event_log; ver docker-compose.prod.yml.
      EVENT_LOG_WORKER_DRAINS: ${EVENT_LOG_WORKER_DRAINS:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      waha:
        condition: service_healthy
      srh:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: deskcomm-worker:local
    pull_policy: never
    restart: unless-stopped
    env_file: ${LOCAL_ENV_FILE:-.env.local}
    environment:
      WAHA_API_BASE_URL: http://waha:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      waha:
        condition: service_healthy
    ports:
      # Só 127.0.0.1: /healthz e /metrics do worker não têm autenticação e o
      # /metrics conta filas, sessões e custo de todas as empresas. Sem endereço
      # de bind o Docker publica em 0.0.0.0 — qualquer um na mesma rede (Wi-Fi
      # do café, LAN do escritório) lia os números. O healthcheck roda DENTRO do
      # container e não depende desta linha.
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: deskcomm-scheduler:local
    pull_policy: never
    restart: unless-stopped
    env_file: ${LOCAL_ENV_FILE:-.env.local}
    environment:
      TZ: UTC
      # Os crons autenticam com INTERNAL_CRON_SECRET quando definido; o app
      # aplica a mesma prioridade. Sem este fallback, o scheduler enviava
      # INTERNAL_SECRET e recebia 401 em instalações com os dois segredos.
      INTERNAL_SECRET: ${INTERNAL_CRON_SECRET:-${INTERNAL_SECRET}}
    depends_on:
      app:
        condition: service_healthy

  waha:
    image: devlikeapro/waha:latest-2026.7.2
    restart: unless-stopped
    ports:
      # 127.0.0.1 e não 0.0.0.0: o dashboard do WAHA está ligado logo abaixo e
      # comanda a sessão de WhatsApp — ele tem autenticação própria, com padrão
      # do WAHA, que a chave da API não protege. Sem endereço de bind, qualquer
      # máquina da rede da VM alcançaria esse painel. `docker-compose.prod.yml`
      # resolve o mesmo problema desligando o dashboard ("nunca expor o
      # dashboard num template público", linha 156) e não publicando porta
      # nenhuma para o WAHA; aqui ele fica de pé para quem desenvolve, mas só
      # atende de dentro da própria máquina (de fora, `ssh -L 3030:localhost:3030`).
      - "127.0.0.1:3030:3000"
    environment:
      # O WAHA recebe o hash com o prefixo para hashear a chave plaintext
      # enviada pelo app em X-Api-Key.
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://host.docker.internal:${APP_PORT:-3000}/api/v1/webhooks/waha
      # `message.reaction` entra: é por onde chega o 👍/😐 do cliente (#2797).
      # Mantido IGUAL ao `docker-compose.prod.yml` — o consumidor local de quem
      # desenvolve não pode ver menos eventos que a instalação real.
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,message.reaction,session.status,state.change"
      # Nome EXATO da doc do WAHA (events#hmac-authentication): sem o _KEY ele ignora.
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_DASHBOARD_ENABLED: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Banco, API REST e gateway: os mesmos de docker-compose.prod.yml, com porta
  # no 127.0.0.1 para o psql e o `pnpm dev` do host.
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./scripts/selfhost-prelude.sql:/deskcomm/selfhost-prelude.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-segredo-local-de-desenvolvimento-com-32-bytes}
      PGRST_DB_MAX_ROWS: "1000"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-54321}:8000"
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - postgrest

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  db-data:
  waha-data:
  waha-media:
